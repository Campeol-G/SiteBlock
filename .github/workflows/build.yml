name: build

on:
  push:
  pull_request:

# Push repetido cancela o build anterior: sem isso, a fila de jobs so cresce.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Sem teto, um daemon travado segura o job por 6 horas (tempo padrão).
    timeout-minutes: 30
    strategy:
      # macOS entrou na matriz porque o README promete suporte a ele: o caminho
      # do LaunchDaemon/launchctl nunca era exercitado por build nenhum.
      fail-fast: false
      matrix:
        # ATENÇÃO: 'shell' não aceita expressão. O build usa bash em todos os
        # SOs (o runner Windows tem Git Bash) e chama o wrapper POSIX ./mvnw.
        include:
          - os: ubuntu-latest
            script: ./run.sh
          - os: macos-latest
            script: ./run.sh
          - os: windows-latest
            script: cmd /c run.bat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      # 'clean' é obrigatório: sem ele o shade re-sombreia o fat-jar anterior
      # e o artefato final deixa de ser reproduzível.
      - name: Build (gera o fat-jar distribuível)
        shell: bash
        run: bash ./mvnw -B clean package
      # Sem login o log do run não abre. A anotação aparece na página e diz
      # qual teste quebrou, que é o que falta para diagnosticar a matriz.
      - name: Anota falhas de teste
        if: failure()
        shell: bash
        run: |
          set +e
          shopt -s globstar nullglob
          total=0
          for report in **/target/surefire-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$report"; then
              total=$((total + 1))
              [ "$total" -gt 10 ] && break
              msg=$(grep -E -A 8 '<<< (FAILURE|ERROR)' "$report" | head -n 12)
              msg=${msg//'%'/'%25'}
              msg=${msg//$'\r'/}
              msg=${msg//$'\n'/'%0A'}
              echo "::error title=Falha em ${report}::${msg}"
            fi
          done
          if [ "$total" -eq 0 ]; then
            echo "::error title=Build falhou::Nenhum relatório do Surefire encontrado; a falha pode ser de compilação."
          fi
      - name: Verifica o fat-jar
        shell: bash
        run: |
          set -euo pipefail

          # O passo ja roda no diretorio do workspace: nao depende de 'cd' com
          # caminho do Windows, que o bash do Git for Windows nao entende igual.
          JAR=""
          for candidate in sitelock-app/target/siteblock-*.jar; do
            case "$candidate" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            JAR="$candidate"
            break
          done
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::fat-jar nao encontrado em sitelock-app/target/siteblock-*.jar"
            exit 1
          fi
          echo "Artefato: $JAR"

          # O jar precisa responder: Main-Class ausente ou errado quebra 'java -jar'.
          java -jar "$JAR" --version

          # O manifest precisa apontar o Main-Class.
          tmp="target/jar-check"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cp "$JAR" "$tmp/app.jar"
          (cd "$tmp" && jar xf app.jar META-INF/MANIFEST.MF)
          grep -q '^Main-Class: com.sitelock.SiteLockApplication' "$tmp/META-INF/MANIFEST.MF"
          echo "Main-Class: OK"

          # O shade tem que ter rodado: sem as dependencias dentro, nao e o fat-jar.
          (cd "$tmp" && jar tf app.jar > entries.txt)
          grep -q '^picocli/CommandLine.class$' "$tmp/entries.txt"
          grep -q '^com/sitelock/SiteLockApplication.class$' "$tmp/entries.txt"
          echo "Conteudo do fat-jar: OK"

      # O script de execucao tambem e parte do que o usuario instala: um
      # macOS < 12.3 nao tem 'readlink -f' e o script achava o jar errado.
      - name: Smoke test do script de execução
        shell: bash
        run: ${{ matrix.script }} --version
