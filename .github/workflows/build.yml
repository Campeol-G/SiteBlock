name: build

on:
  push:
  pull_request:

# Repeated push cancels the previous build: without this, the job queue just grows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Without a ceiling, a stuck daemon holds the job for 6 hours (default time).
    timeout-minutes: 30
    strategy:
      # macOS entered the matrix because the README promises support for it: the
      # LaunchDaemon/launchctl path was never exercised by any build.
      fail-fast: false
      matrix:
        # NOTE: 'shell' does not accept expressions. The build uses bash on all
        # OSes (the Windows runner has Git Bash) and calls the POSIX wrapper ./mvnw.
        include:
          - os: ubuntu-latest
            script: ./run.sh
          - os: macos-latest
            script: ./run.sh
          - os: windows-latest
            script: cmd /c run.bat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      # 'clean' is mandatory: without it shade shadows the previous fat-jar
      # and the final artifact stops being reproducible.
      - name: Build (produces the distributable fat-jar)
        shell: bash
        run: bash ./mvnw -B clean package
      # Without logging in, the run log cannot be opened. The annotation appears
      # on the page and says which test broke, which is exactly what you need to
      # diagnose the matrix.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          set +e
          shopt -s globstar nullglob
          total=0
          for report in **/target/surefire-reports/*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)' "$report"; then
              total=$((total + 1))
              [ "$total" -gt 10 ] && break
              msg=$(grep -E -A 8 '<<< (FAILURE|ERROR)' "$report" | head -n 12)
              msg=${msg//'%'/'%25'}
              msg=${msg//$'\r'/}
              msg=${msg//$'\n'/'%0A'}
              echo "::error title=Failure in ${report}::${msg}"
            fi
          done
          if [ "$total" -eq 0 ]; then
            echo "::error title=Build failed::No Surefire report found; the failure may be a compilation error."
          fi
      - name: Verify the fat-jar
        shell: bash
        run: |
          set -euo pipefail

          # The step already runs in the workspace directory: no need for a 'cd'
          # with a Windows path, which Git for Windows bash does not handle the
          # same way.
          JAR=""
          for candidate in sitelock-app/target/siteblock-*.jar; do
            case "$candidate" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            JAR="$candidate"
            break
          done
          if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
            echo "::error::fat-jar not found at sitelock-app/target/siteblock-*.jar"
            exit 1
          fi
          echo "Artifact: $JAR"

          # The jar must respond: a missing or wrong Main-Class breaks 'java -jar'.
          java -jar "$JAR" --version

          # The manifest must point to the Main-Class.
          tmp="target/jar-check"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          cp "$JAR" "$tmp/app.jar"
          (cd "$tmp" && jar xf app.jar META-INF/MANIFEST.MF)
          grep -q '^Main-Class: com.sitelock.SiteLockApplication' "$tmp/META-INF/MANIFEST.MF"
          echo "Main-Class: OK"

          # Shade must have run: without the dependencies inside, it is not the fat-jar.
          (cd "$tmp" && jar tf app.jar > entries.txt)
          grep -q '^picocli/CommandLine.class$' "$tmp/entries.txt"
          grep -q '^com/sitelock/SiteLockApplication.class$' "$tmp/entries.txt"
          echo "fat-jar contents: OK"

      # The launcher script is also part of what the user installs: on
      # macOS < 12.3 there is no 'readlink -f', and the script found the wrong jar.
      - name: Smoke test the launcher script
        shell: bash
        run: ${{ matrix.script }} --version
